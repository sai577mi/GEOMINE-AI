<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GeoMine Earth — live 3D world viewer</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{--bg:#050a14;--glass:rgba(12,20,36,.72);--line:rgba(140,180,255,.18);--fg:#e8eefc;--mute:#8fa3c7;--acc:#4fd1c5;--hi:#ff5d5d;--med:#ffb020;--lo:#3ddc97}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0b1730,#02050b 70%)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{padding:9px 14px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand b{color:var(--acc)}
#searchbox{position:relative;flex:1;max-width:420px}
#q{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:inherit;outline:none;backdrop-filter:blur(14px)}
#q:focus{border-color:var(--acc)}
#res{position:absolute;top:46px;left:0;right:0;overflow:hidden;display:none}
#res button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
#res button:hover{background:rgba(79,209,197,.12)}
#res small{color:var(--mute)}
a.nav{margin-left:auto;font-size:13px;padding:9px 14px;color:var(--fg);text-decoration:none;white-space:nowrap}
a.nav:hover{color:var(--acc)}
#left{position:absolute;top:68px;left:12px;width:270px;max-height:calc(100% - 150px);overflow:auto;padding:12px;z-index:4}
#right{position:absolute;top:68px;right:12px;width:330px;max-height:calc(100% - 150px);overflow:auto;padding:14px;z-index:4;display:none}
h3{margin:0 0 8px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
.sec{margin-bottom:14px}
label.row{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer}
label.row input{accent-color:var(--acc)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.btn{background:rgba(79,209,197,.14);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);color:#04201d}
.mn{display:block;width:100%;text-align:left;margin:3px 0}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:5;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
#bar input[type=date]{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px;font:inherit;color-scheme:dark}
#status{position:absolute;left:12px;bottom:14px;font-size:11px;color:var(--mute);padding:6px 10px;z-index:4;max-width:260px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;color:#06121f}
.High{background:var(--hi)}.Medium{background:var(--med)}.Low{background:var(--lo)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px}
.day b{display:block;font-size:11px;color:var(--mute);font-weight:600}
.day .ic{font-size:20px}
.risk{display:flex;align-items:flex-end;gap:5px;height:84px;margin:8px 0 4px}
.risk div{flex:1;border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
.risk span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
.lab{display:flex;gap:5px;font-size:10px;color:var(--mute);text-align:center}.lab div{flex:1}
.note{font-size:11px;color:var(--mute);margin-top:6px}
.big{font-size:30px;font-weight:700}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:9;display:none;font-size:12px}
.maplibregl-popup-content{background:#0c1424;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:240px}
.maplibregl-popup-tip{border-top-color:#0c1424!important;border-bottom-color:#0c1424!important}
.maplibregl-ctrl-attrib{background:rgba(5,10,20,.6)!important;color:var(--mute)!important}
.maplibregl-ctrl-attrib a{color:var(--mute)!important}
#close{float:right}
@media(max-width:760px){
 #left{top:auto;bottom:70px;left:8px;right:8px;width:auto;max-height:34%;display:none}
 #left.open{display:block}
 #right{top:auto;bottom:70px;left:8px;right:8px;width:auto;max-height:46%}
 #top{flex-wrap:wrap;right:8px;left:8px}
 #searchbox{order:5;flex:1 1 100%;max-width:none}
 #left{top:112px;bottom:auto;max-height:calc(100% - 200px)}
 #right{bottom:78px;max-height:52%}
 #bar{bottom:8px;gap:5px;padding:6px 8px;flex-wrap:nowrap}
 #bar .btn{padding:6px 8px}#bar input[type=date]{width:128px}
 #dPlay{font-size:0}#dPlay::before{content:"▶ Loop";font-size:14px}
 .brand span{display:none}
 #status{display:none}
 #layersBtn{display:inline-block!important}
}
#layersBtn{display:none}
</style>
</head>
<script src="intro.js"></script>
<body>
<div id="map"></div>
<div id="top">
  <div class="glass brand">🌍 <b>GeoMine</b> <span>Earth</span></div>
  <div id="searchbox"><input id="q" placeholder="Search any city, place or mine…" autocomplete="off"><div id="res" class="glass"></div></div>
  <button id="layersBtn" class="btn glass">Layers</button>
  <a class="glass nav" href="index.html">← Control Room</a>
</div>

<div id="left" class="glass">
  <div class="sec"><h3>Base imagery</h3>
    <label class="row"><input type="radio" name="base" value="sat" checked> NASA daily satellite (true colour)</label>
    <label class="row"><input type="radio" name="base" value="hires"> Hi-res satellite (Esri)</label>
    <label class="row"><input type="radio" name="base" value="osm"> Streets (OpenStreetMap)</label>
    <label class="row"><input type="radio" name="base" value="blue"> Blue Marble (static)</label>
  </div>
  <div class="sec"><h3>Live layers</h3>
    <label class="row"><input type="checkbox" data-l="radar"> Rain radar (past ~2 h)</label>
    <label class="row"><input type="checkbox" data-l="imerg"> Satellite rainfall (NASA IMERG)</label>
    <label class="row"><input type="checkbox" data-l="fires"> Active fires (NASA MODIS)</label>
    <label class="row"><input type="checkbox" data-l="quakes" checked> <span class="sw" style="background:#ff9f43"></span> Earthquakes (USGS, 24 h)</label>
    <label class="row"><input type="checkbox" data-l="events" checked> <span class="sw" style="background:#ff5d5d"></span> Natural events (NASA EONET)</label>
    <label class="row"><input type="checkbox" data-l="mn" checked> <span class="sw" style="background:#b388ff"></span> Manganese districts</label>
  </div>
  <div class="sec"><h3>3D</h3>
    <label class="row"><input type="checkbox" id="terrain"> 3D terrain (exaggeration ×1.6)</label>
    <label class="row"><input type="checkbox" id="spin" checked> Auto-rotate globe</label>
    <button class="btn" id="tilt">Tilt 60°</button> <button class="btn" id="north">Reset view</button>
  </div>
  <div class="sec"><h3>Manganese districts</h3><div id="mnlist"></div>
    <div class="note">Approximate district centres for orientation only — not mine boundaries.</div></div>
</div>

<div id="right" class="glass"></div>
<div id="toast" class="glass"></div>

<div id="bar" class="glass">
  <button class="btn" id="dPrev">◀</button>
  <input type="date" id="date">
  <button class="btn" id="dNext">▶</button>
  <button class="btn" id="dToday">Latest</button>
  <button class="btn" id="dPlay">▶ 7-day loop</button>
</div>
<div id="status" class="glass">Click anywhere on the globe to select a location.</div>

<script>
/* GeoMine-AI core: models, telemetry simulator, risk + actions, 3D reserve model.
   Port of engine.py so the app runs fully in the browser. */
function makeCore(MODELS) {
  "use strict";

  /* ---------- random numbers ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function Rng(seed) {
    const u = mulberry32(seed);
    const self = {
      u: u,
      uniform: (a, b) => a + (b - a) * u(),
      normal: (m, s) => {
        let x = 0, y = 0;
        while (x === 0) x = u();
        y = u();
        return m + s * Math.sqrt(-2 * Math.log(x)) * Math.cos(2 * Math.PI * y);
      },
      exp: (scale) => -scale * Math.log(1 - u()),
      int: (a, b) => a + Math.floor(u() * (b - a)),
      gamma: (shape, scale) => {
        if (shape < 1) return self.gamma(shape + 1, scale) * Math.pow(u(), 1 / shape);
        const d = shape - 1 / 3, c = 1 / Math.sqrt(9 * d);
        for (;;) {
          let x, v;
          do { x = self.normal(0, 1); v = 1 + c * x; } while (v <= 0);
          v = v * v * v;
          const uu = u();
          if (Math.log(uu) < 0.5 * x * x + d - d * v + d * Math.log(v)) return d * v * scale;
        }
      },
    };
    return self;
  }

  /* ---------- tree models (XGBoost exported to JSON) ---------- */
  function prepare(m) {
    m.trees.forEach((t) => {
      const n = t.f.length;
      t.t = t.t.map(Math.fround);
      t.val = new Array(n);
      for (let i = n - 1; i >= 0; i--) {
        if (t.f[i] < 0) t.val[i] = t.v[i];
        else {
          const cl = t.c[t.l[i]], cr = t.c[t.r[i]];
          t.val[i] = (cl * t.val[t.l[i]] + cr * t.val[t.r[i]]) / (cl + cr);
        }
      }
    });
    return m;
  }
  prepare(MODELS.clf); prepare(MODELS.sim);
  const CLF_F = MODELS.clf.features, SIM_F = MODELS.sim.features;
  const sigmoid = (z) => 1 / (1 + Math.exp(-z));

  function leaf(t, x) {
    let i = 0;
    while (t.f[i] >= 0) i = Math.fround(x[t.f[i]]) < t.t[i] ? t.l[i] : t.r[i];
    return t.v[i];
  }
  function predictClf(x) {
    let m = Math.log(MODELS.clf.base / (1 - MODELS.clf.base));
    for (const t of MODELS.clf.trees) m += leaf(t, x);
    return sigmoid(m);
  }
  function contribs(x) {
    const out = new Array(CLF_F.length).fill(0);
    for (const t of MODELS.clf.trees) {
      let i = 0;
      while (t.f[i] >= 0) {
        const nx = Math.fround(x[t.f[i]]) < t.t[i] ? t.l[i] : t.r[i];
        out[t.f[i]] += t.val[nx] - t.val[i];
        i = nx;
      }
    }
    return out;
  }
  function predictSimRow(x) {
    let m = MODELS.sim.base;
    for (const t of MODELS.sim.trees) m += leaf(t, x);
    return m;
  }
  const predictAch = (s) => predictSimRow(SIM_F.map((k) => s[k]));

  /* ---------- forecast ---------- */
  function makeForecast(seedDay, month) {
    const rng = Rng(seedDay);
    const rain = {};
    for (let off = -2; off <= 7; off++) {
      const m = month;
      const p = (m === 7 || m === 8) ? 0.60 : (m === 6 || m === 9) ? 0.40 : m === 10 ? 0.10 : 0.03;
      const scale = (m >= 6 && m <= 9) ? 22 : 8;
      rain[off] = rng.u() < p ? Math.round(rng.gamma(0.9, scale) * 10) / 10 : 0;
    }
    return rain;
  }
  function withStorm(rain, extra) {
    const r = Object.assign({}, rain);
    if (extra > 0) { r[0] += 0.3 * extra; r[1] += extra; r[2] += 0.5 * extra; }
    return r;
  }

  /* ---------- telemetry simulator ---------- */
  function MineSim(name, seed) {
    const rng = Rng(seed);
    const units = [];
    for (let i = 1; i <= 4; i++) units.push({ name: "Drill jumbo " + i, kind: "drill" });
    for (let i = 1; i <= 3; i++) units.push({ name: "Loader " + i, kind: "loader" });
    units.push({ name: "Main hoist", kind: "hoist" });
    units.forEach((u) => {
      u.health = rng.uniform(55, 95); u.status = "ok"; u.repair = 0; u.hist = [u.health];
    });
    return {
      name, units, rng, absent: 6, blast: 1, ticks: 0,
      histAch: MODELS.seed.ach.slice(-6), histDrills: MODELS.seed.drills.slice(-6),
      histLoaders: MODELS.seed.loaders.slice(-6),
      tick(rs) {
        rs = Math.min(Math.max(rs, 0), 1);
        for (const u of units) {
          if (u.status === "down") {
            if (--u.repair <= 0) { u.status = "ok"; u.health = rng.uniform(80, 95); }
          } else {
            u.health -= rng.gamma(1.2, 0.30) * (1 + 1.5 * rs);
            if (rng.u() < 0.006 * (1 + 2 * rs)) u.health -= rng.uniform(10, 30);
            if (u.health <= 20) { u.health = 20; u.status = "down"; u.repair = rng.int(8, 24); }
          }
          u.hist.push(u.health); if (u.hist.length > 40) u.hist.shift();
        }
        this.absent = Math.min(Math.max(this.absent + 0.2 * (6 - this.absent) + rng.normal(0, 0.5), 2), 20);
        this.blast = Math.min(Math.max(0.7 * this.blast + 0.3 * rng.exp(1) + 0.25 * rs, 0.2), 8);
        this.ticks++;
      },
      fail(kind) {
        for (const u of units) if (u.kind === kind && u.status === "ok") {
          u.health = 20; u.status = "down"; u.repair = 20; u.hist.push(20); return u.name;
        }
        return null;
      },
      snapshot() {
        const ok = (k) => units.filter((u) => u.kind === k && u.status === "ok").length;
        const h = units.find((u) => u.kind === "hoist");
        return {
          drills_available: ok("drill"), loaders_available: ok("loader"),
          hoist_uptime_pct: h.status === "ok" ? Math.min(Math.max(h.health, 40), 100) : 40,
          blast_delay_hours: this.blast, absentee_pct: this.absent,
        };
      },
      maintenance() {
        return units.map((u) => {
          let eta = null;
          if (u.status === "ok" && u.hist.length >= 10) {
            const y = u.hist.slice(-20), n = y.length;
            const mx = (n - 1) / 2, my = y.reduce((a, b) => a + b, 0) / n;
            let sxy = 0, sxx = 0;
            y.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) * (i - mx); });
            const slope = sxy / sxx;
            if (slope < -0.05) eta = Math.max((u.health - 20) / -slope, 0) * 0.25;
          }
          return { name: u.name, kind: u.kind, status: u.status, health: u.health, eta };
        });
      },
    };
  }

  /* ---------- risk and actions ---------- */
  const ACTIONS = {
    overtime: { en: "Call standby crew / overtime", hi: "स्टैंडबाय क्रू / ओवरटाइम बुलाएँ", cost: 1.0 },
    drill: { en: "Redeploy 1 spare drill jumbo", hi: "1 अतिरिक्त ड्रिल जंबो तैनात करें", cost: 1.5 },
    loader: { en: "Redeploy 1 loader from another face", hi: "दूसरे फेस से 1 लोडर लगाएँ", cost: 1.5 },
    hoist: { en: "Priority repair / inspect the hoist", hi: "हॉइस्ट की प्राथमिकता से मरम्मत/जाँच", cost: 2.0 },
    blast: { en: "Re-sequence blasting to a dry window", hi: "ब्लास्टिंग को सूखे समय में स्थानांतरित करें", cost: 0.5 },
  };
  function applyAction(k, s) {
    if (k === "overtime") s.absentee_pct = Math.max(s.absentee_pct - 4, 3);
    else if (k === "drill") s.drills_available = Math.min(s.drills_available + 1, 4);
    else if (k === "loader") s.loaders_available = Math.min(s.loaders_available + 1, 3);
    else if (k === "hoist") s.hoist_uptime_pct = Math.min(s.hoist_uptime_pct + 8, 100);
    else if (k === "blast") s.blast_delay_hours = Math.max(s.blast_delay_hours - 1.5, 0.5);
  }
  const KEYS = Object.keys(ACTIONS);
  function combosWithin(budget) {
    const out = [];
    for (let mask = 0; mask < (1 << KEYS.length); mask++) {
      const c = KEYS.filter((_, i) => mask & (1 << i));
      const cost = c.reduce((a, k) => a + ACTIONS[k].cost, 0);
      if (cost <= budget + 1e-9) out.push({ keys: c, cost });
    }
    out.sort((a, b) => a.keys.length - b.keys.length);
    return out;
  }
  const COMBOS = combosWithin(3.0);

  function evaluate(mine, rain, month, planned) {
    const snap = mine.snapshot();
    const rTom = rain[1], rToday = rain[0];
    const r3fc = rTom + rToday + rain[-1];
    const r3lag = rToday + rain[-1] + rain[-2];
    const achToday = predictAch(Object.assign({}, snap, { rain_3day_mm: r3lag }));
    const a7 = mine.histAch.concat([achToday]).slice(-7);
    const d7 = mine.histDrills.concat([snap.drills_available]).slice(-7);
    const l7 = mine.histLoaders.concat([snap.loaders_available]).slice(-7);
    const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const x = [
      rTom, r3fc, snap.drills_available, snap.loaders_available, snap.hoist_uptime_pct,
      snap.blast_delay_hours, snap.absentee_pct, r3lag, achToday, mean(a7), mean(d7), mean(l7),
      a7.filter((v) => v < 90).length,
      Math.sin((2 * Math.PI * month) / 12), Math.cos((2 * Math.PI * month) / 12),
    ];
    const prob = predictClf(x);
    const level = prob >= 0.6 ? "High" : prob >= 0.3 ? "Medium" : "Low";
    const c = contribs(x);
    const reasons = c.map((v, i) => ({ f: CLF_F[i], value: x[i], c: v }))
      .sort((a, b) => Math.abs(b.c) - Math.abs(a.c)).slice(0, 3);

    const state = Object.assign({}, snap, {
      blast_delay_hours: rTom > 20 ? MODELS.bd_wet : MODELS.bd_dry, rain_3day_mm: r3fc,
    });
    let base = null, best = { score: 0, ach: 0, combo: COMBOS[0] };
    COMBOS.forEach((cb, i) => {
      const s = Object.assign({}, state);
      cb.keys.forEach((k) => applyAction(k, s));
      const a = predictAch(s);
      if (i === 0) { base = a; best = { score: 0, ach: a, combo: cb }; return; }
      const score = a - base - 0.3 * cb.cost;
      if (score > best.score + 1e-9) best = { score, ach: a, combo: cb };
    });
    const advice = [];
    if (rTom >= 25 || r3fc >= 60) advice.push("rain");
    if (snap.drills_available <= 2) advice.push("drills");
    if (snap.hoist_uptime_pct < 85) advice.push("hoist");
    if (snap.absentee_pct >= 10) advice.push("absent");
    return {
      prob, level, reasons, snap, rainTomorrow: rTom, rain3d: r3fc,
      achBefore: base, achAfter: best.ach, tonnesRecovered: ((best.ach - base) / 100) * planned,
      actions: best.combo.keys, cost: best.combo.cost, advice, planned,
    };
  }

  function scenarios(mine, rain, month, planned) {
    const live = evaluate(mine, rain, month, planned);
    const healthy = { drills_available: 4, loaders_available: 3, hoist_uptime_pct: 95, blast_delay_hours: MODELS.bd_dry, absentee_pct: 6, rain_3day_mm: 10 };
    const sLive = Object.assign({}, live.snap, {
      blast_delay_hours: live.rainTomorrow > 20 ? MODELS.bd_wet : MODELS.bd_dry, rain_3day_mm: live.rain3d,
    });
    const sStorm = Object.assign({}, healthy, { rain_3day_mm: 90, blast_delay_hours: MODELS.bd_wet });
    const sFail = Object.assign({}, healthy, { drills_available: 2, hoist_uptime_pct: 80 });
    const sFix = Object.assign({}, sStorm); ["overtime", "blast"].forEach((k) => applyAction(k, sFix));
    const rows = [
      ["Live conditions now", sLive], ["Healthy mine (reference)", healthy],
      ["Heavy storm (90 mm / 3 days)", sStorm], ["Two drills down + weak hoist", sFail],
      ["Storm + overtime + dry-window blasting", sFix],
    ];
    return rows.map(([name, s]) => { const a = predictAch(s); return { name, pct: a, tonnes: (a / 100) * planned }; });
  }

  /* ---------- 3D reserve model (Gaussian process / kriging) ---------- */
  const XMAX = 800, YMAX = 400, ZMAX = 100, BX = 40, BY = 40, BZ = 5, DENSITY = 3.6;
  const LS = [180, 130, 4.5], NOISE_SD = 1.5;
  const NX = XMAX / BX, NY = YMAX / BY, NZ = ZMAX / BZ;

  function trueGrade(x, y, z) {
    const zc = 25 + 0.05 * x + 0.02 * y;
    const lens = Math.exp(-((z - zc) ** 2) / (2 * 3.5 ** 2));
    const env = Math.exp(-0.5 * (((x - 400) / 280) ** 4 + ((y - 200) / 150) ** 2));
    const ripple = 1.5 * Math.sin(x / 70) * Math.cos(y / 60);
    return 14 + 32 * lens * env + ripple;
  }
  function baseCollars(n, seed) {
    const rng = Rng(seed || 7);
    const nx = Math.ceil(Math.sqrt(n * 2)), ny = Math.ceil(n / nx);
    const pts = [];
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++)
      pts.push([((i + 0.5) * XMAX) / nx, ((j + 0.5) * YMAX) / ny]);
    return pts.slice(0, n).map(([x, y]) => [x + rng.normal(0, 18), y + rng.normal(0, 18)]);
  }
  function drillAssays(collars) {
    const pts = [], g = [];
    for (const [x, y] of collars) {
      const rng = Rng(Math.floor(Math.abs(x) * 1000 + Math.abs(y) * 7));
      for (let z = 2.5; z < ZMAX; z += 5) { pts.push([x, y, z]); g.push(trueGrade(x, y, z) + rng.normal(0, NOISE_SD)); }
    }
    return { pts, g };
  }
  const kern = (a, b) => Math.exp(-0.5 * (((a[0] - b[0]) / LS[0]) ** 2 + ((a[1] - b[1]) / LS[1]) ** 2 + ((a[2] - b[2]) / LS[2]) ** 2));

  function fitReserve(collars) {
    const { pts, g } = drillAssays(collars);
    const n = pts.length;
    const mu = g.reduce((a, b) => a + b, 0) / n;
    const sd = Math.sqrt(g.reduce((a, b) => a + (b - mu) ** 2, 0) / n);
    const ys = g.map((v) => (v - mu) / sd);
    const noise = (NOISE_SD / sd) ** 2;
    const L = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j <= i; j++) {
        let s = kern(pts[i], pts[j]) + (i === j ? noise : 0);
        for (let k = 0; k < j; k++) s -= L[i * n + k] * L[j * n + k];
        L[i * n + j] = i === j ? Math.sqrt(Math.max(s, 1e-12)) : s / L[j * n + j];
      }
    }
    const z = new Float64Array(n), alpha = new Float64Array(n);
    for (let i = 0; i < n; i++) { let s = ys[i]; for (let k = 0; k < i; k++) s -= L[i * n + k] * z[k]; z[i] = s / L[i * n + i]; }
    for (let i = n - 1; i >= 0; i--) { let s = z[i]; for (let k = i + 1; k < n; k++) s -= L[k * n + i] * alpha[k]; alpha[i] = s / L[i * n + i]; }

    const total = NX * NY * NZ;
    const X = new Float32Array(total), Y = new Float32Array(total), Z = new Float32Array(total);
    const mean = new Float32Array(total), std = new Float32Array(total), truth = new Float32Array(total);
    const kv = new Float64Array(n), v = new Float64Array(n);
    let idx = 0;
    for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let k = 0; k < NZ; k++) {
      const p = [(i + 0.5) * BX, (j + 0.5) * BY, (k + 0.5) * BZ];
      let m = 0;
      for (let a = 0; a < n; a++) { kv[a] = kern(p, pts[a]); m += kv[a] * alpha[a]; }
      let vv = 0;
      for (let a = 0; a < n; a++) { let s = kv[a]; for (let b = 0; b < a; b++) s -= L[a * n + b] * v[b]; v[a] = s / L[a * n + a]; vv += v[a] * v[a]; }
      X[idx] = p[0]; Y[idx] = p[1]; Z[idx] = p[2];
      mean[idx] = mu + sd * m; std[idx] = Math.max(sd * Math.sqrt(Math.max(1 - vv, 0)), 0.3);
      truth[idx] = trueGrade(p[0], p[1], p[2]); idx++;
    }
    // independent check on 150 random points
    const rng = Rng(99); let se = 0;
    for (let t = 0; t < 150; t++) {
      const p = [rng.uniform(0, XMAX), rng.uniform(0, YMAX), rng.uniform(0, ZMAX)];
      let m = 0; for (let a = 0; a < n; a++) m += kern(p, pts[a]) * alpha[a];
      se += (mu + sd * m - trueGrade(p[0], p[1], p[2])) ** 2;
    }
    return { X, Y, Z, mean, std, truth, collars, rmse: Math.sqrt(se / 150), n: total };
  }

  function erf(x) {
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  const cdf = (z) => 0.5 * (1 + erf(z / Math.SQRT2));

  function tonnage(rm, cutoff) {
    const blk = BX * BY * BZ * DENSITY;
    let est = 0, truth = 0, gSum = 0, gN = 0;
    const cls = { high: 0, med: 0, low: 0 };
    for (let i = 0; i < rm.n; i++) {
      const p = 1 - cdf((cutoff - rm.mean[i]) / rm.std[i]);
      est += p * blk; if (rm.truth[i] >= cutoff) truth += blk;
      if (p >= 0.5) { gSum += rm.mean[i]; gN++; }
      if (p >= 0.8) cls.high += p * blk; else if (p >= 0.5) cls.med += p * blk; else if (p >= 0.2) cls.low += p * blk;
    }
    return { est, truth, meanGrade: gN ? gSum / gN : 0, cls };
  }
  function nextHoles(rm, cutoff, k, minSep) {
    k = k || 3; minSep = minSep || 120;
    const score = new Float64Array(NX * NY);
    for (let i = 0; i < rm.n; i++) {
      const ix = Math.floor(rm.X[i] / BX), iy = Math.floor(rm.Y[i] / BY);
      const p = 1 - cdf((cutoff - rm.mean[i]) / rm.std[i]);
      score[ix * NY + iy] += p * (1 - p);
    }
    const order = Array.from(score.keys()).sort((a, b) => score[b] - score[a]);
    const picks = [];
    for (const f of order) {
      const x = ((Math.floor(f / NY) + 0.5) * BX), y = ((f % NY) + 0.5) * BY;
      const farFromPicks = picks.every((q) => Math.hypot(x - q.x, y - q.y) >= minSep);
      const farFromHoles = rm.collars.every(([cx, cy]) => Math.hypot(x - cx, y - cy) >= 60);
      if (farFromPicks && farFromHoles) picks.push({ x, y, score: score[f] });
      if (picks.length === k) break;
    }
    return picks;
  }

  return {
    CLF_F, SIM_F, MODELS, predictClf, predictAch, contribs, makeForecast, withStorm, MineSim,
    ACTIONS, evaluate, scenarios, baseCollars, fitReserve, tonnage, nextHoles,
    dims: { NX, NY, NZ, XMAX, YMAX, ZMAX, BX, BY, BZ, DENSITY },
  };
}

  document.querySelectorAll("input[name=base]").forEach((r) => (r.onchange = () => {
    ["sat", "hires", "osm"].forEach((id) => map.setLayoutProperty(id, "visibility", "none"));
    if (r.value !== "blue") map.setLayoutProperty(r.value, "visibility", "visible");
    $("#bar").style.opacity = r.value === "sat" ? 1 : 0.55;
  }));
  document.querySelectorAll("input[data-l]").forEach((c) => (c.onchange = () => {
    const l = c.dataset.l, v = c.checked ? "visible" : "none";
    if (l === "radar") { radarFrames.forEach((f, i) => map.getLayer(f.id) && map.setLayoutProperty(f.id, "visibility", "none")); if (c.checked) { radarOn(); } else clearInterval(radarTimer); return; }
    map.setLayoutProperty(l, "visibility", v);
  }));
  $("#terrain").onchange = (e) => {
    try {
      if (e.target.checked) { map.setTerrain({ source: "dem", exaggeration: 1.6 }); if (map.getPitch() < 40) map.easeTo({ pitch: 60, duration: 1200 }); toast("3D terrain on — zoom into mountains/valleys and tilt with right-drag."); }
      else map.setTerrain(null);
    } catch (err) { toast("3D terrain is not supported by this browser/GPU."); e.target.checked = false; }
  };
  $("#tilt").onclick = () => map.easeTo({ pitch: map.getPitch() > 30 ? 0 : 60, duration: 900 });
  $("#north").onclick = () => map.easeTo({ pitch: 0, bearing: 0, zoom: 1.6, center: [78, 22], duration: 1400 });
  $("#layersBtn").onclick = () => $("#left").classList.toggle("open");

  /* ---------------- date ---------------- */
  $("#date").value = curDate; $("#date").max = iso(todayUTC); $("#date").min = "2000-02-24";
  function setDate(d) {
    curDate = d; $("#date").value = d;
    map.getSource("sat").setTiles(trueColor(d));
    map.getSource("imerg").setTiles([GIBS + "IMERG_Precipitation_Rate/default/" + d + "/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png"]);
    map.getSource("fires").setTiles([GIBS + "MODIS_Terra_Thermal_Anomalies_All/default/" + d + "/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png"]);
  }
  const shift = (d, n) => iso(new Date(new Date(d + "T00:00:00Z").getTime() + n * 864e5));
  $("#date").onchange = (e) => e.target.value && setDate(e.target.value);
  $("#dPrev").onclick = () => setDate(shift(curDate, -1));
  $("#dNext").onclick = () => { if (shift(curDate, 1) <= iso(todayUTC)) setDate(shift(curDate, 1)); };
  $("#dToday").onclick = () => setDate(iso(latest));
  $("#dPlay").onclick = () => {
    if (playing) { clearInterval(playing); playing = null; $("#dPlay").textContent = "▶ 7-day loop"; return; }
    let d = shift(iso(latest), -6); setDate(d); $("#dPlay").textContent = "■ Stop";
    playing = setInterval(() => { d = shift(d, 1); if (d > iso(latest)) d = shift(iso(latest), -6); setDate(d); }, 1600);
  };

  /* ---------------- live data ---------------- */
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
  function status(t) { $("#status").textContent = t; }

  async function loadQuakes() {
    try {
      const j = await getJSON("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson");
      const feats = j.features.filter((f) => f.properties.mag != null && f.properties.mag >= 1.5);
      map.getSource("quakes").setData({ type: "FeatureCollection", features: feats.map((f) => ({ type: "Feature", geometry: f.geometry, properties: { mag: f.properties.mag, place: f.properties.place, time: f.properties.time } })) });
      status(feats.length + " earthquakes (24 h) · updated " + new Date().toLocaleTimeString());
    } catch (e) { status("Earthquake feed unavailable."); }
  }
  async function loadEvents() {
    try {
      const j = await getJSON("https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=120");
      const feats = [];
      for (const ev of j.events || []) {
        const g = ev.geometry && ev.geometry[ev.geometry.length - 1];
        if (!g || g.type !== "Point") continue;
        const cat = ev.categories && ev.categories[0];
        feats.push({ type: "Feature", geometry: { type: "Point", coordinates: g.coordinates }, properties: { title: ev.title, cat: cat ? cat.id : "", catTitle: cat ? cat.title : "", date: g.date } });
      }
      map.getSource("events").setData({ type: "FeatureCollection", features: feats });
    } catch (e) { /* silent: optional layer */ }
  }
  async function loadRadar() {
    try {
      const j = await getJSON("https://api.rainviewer.com/public/weather-maps.json");
      const frames = (j.radar && j.radar.past) || [];
      radarFrames.forEach((f) => { if (map.getLayer(f.id)) map.removeLayer(f.id); if (map.getSource(f.id)) map.removeSource(f.id); });
      radarFrames = frames.map((f, i) => ({ id: "radar" + i, time: f.time, url: j.host + f.path + "/256/{z}/{x}/{y}/2/1_1.png" }));
      radarFrames.forEach((f) => {
        map.addSource(f.id, raster([f.url], { maxzoom: 7, attribution: "RainViewer" }));
        map.addLayer({ id: f.id, type: "raster", source: f.id, layout: { visibility: "none" }, paint: { "raster-opacity": 0.8, "raster-fade-duration": 0 } }, "quakes");
      });
      if (document.querySelector("[data-l=radar]").checked) radarOn();
    } catch (e) { /* radar optional */ }
  }
  function radarOn() {
    clearInterval(radarTimer);
    if (!radarFrames.length) { toast("Radar is not available right now."); return; }
    radarIdx = radarFrames.length - 1;
    const show = () => { radarFrames.forEach((f, i) => map.setLayoutProperty(f.id, "visibility", i === radarIdx ? "visible" : "none")); status("Radar " + new Date(radarFrames[radarIdx].time * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " (local)"); };
    show(); radarTimer = setInterval(() => { radarIdx = (radarIdx + 1) % radarFrames.length; show(); }, 600);
  }

  /* ---------------- search ---------------- */
  let st = null;
  $("#q").addEventListener("input", () => {
    clearTimeout(st); const v = $("#q").value.trim();
    if (v.length < 2) { $("#res").style.display = "none"; return; }
    st = setTimeout(async () => {
      try {
        const j = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=" + encodeURIComponent(v));
        const box = $("#res"); box.innerHTML = "";
        (j.results || []).forEach((r) => {
          const b = document.createElement("button");
          b.innerHTML = esc(r.name) + " <small>" + esc([r.admin1, r.country].filter(Boolean).join(", ")) + "</small>";
          b.onclick = () => { box.style.display = "none"; $("#q").value = r.name; map.flyTo({ center: [r.longitude, r.latitude], zoom: 7, pitch: 45, duration: 2600 }); select(r.latitude, r.longitude, r.name + (r.country ? ", " + r.country : "")); };
          box.appendChild(b);
        });
        if (!box.children.length) box.innerHTML = '<button disabled>No matches</button>';
        box.style.display = "block";
      } catch (e) { toast("Search unavailable (offline?)."); }
    }, 300);
  });
  document.addEventListener("click", (e) => { if (!e.target.closest("#searchbox")) $("#res").style.display = "none"; });
  const ml = $("#mnlist");
  MN.forEach((m) => {
    const b = document.createElement("button"); b.className = "btn mn"; b.textContent = m.n;
    b.onclick = () => { stopSpin(); map.flyTo({ center: m.c, zoom: 8, pitch: 50, duration: 3000 }); select(m.c[1], m.c[0], m.n); };
    ml.appendChild(b);
  });

  /* ---------------- selection: forecast + shortfall outlook ---------------- */
  const WX = { 0: ["☀️", "Clear"], 1: ["🌤️", "Mostly clear"], 2: ["⛅", "Partly cloudy"], 3: ["☁️", "Overcast"], 45: ["🌫️", "Fog"], 48: ["🌫️", "Fog"], 51: ["🌦️", "Drizzle"], 53: ["🌦️", "Drizzle"], 55: ["🌦️", "Drizzle"], 61: ["🌧️", "Rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"], 71: ["🌨️", "Snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"], 80: ["🌦️", "Showers"], 81: ["🌧️", "Showers"], 82: ["⛈️", "Violent showers"], 95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Thunderstorm + hail"], 99: ["⛈️", "Thunderstorm + hail"] };
  const wx = (c) => WX[c] || ["🌡️", "—"];
  let refMine = null;
  function reference() {
    if (!refMine) { refMine = GM.MineSim("Reference", 4242); for (let i = 0; i < 30; i++) refMine.tick(0); }
    return refMine;
  }
  // Same model as the Control Room, fed with the selected place's forecast rain for a healthy reference mine.
  function outlook(daily) {
    const p = daily.precipitation_sum.map((v) => (v == null ? 0 : v));   // index 0,1 = past days; 2 = today
    const out = [];
    for (let d = 0; d < 7; d++) {
      const rain = { [-2]: p[d], [-1]: p[d + 1], 0: p[d + 2], 1: p[d + 3] };
      const month = +daily.time[d + 2].slice(5, 7);
      const r = GM.evaluate(reference(), rain, month, 1000);
      out.push({ date: daily.time[d + 2], rainTom: p[d + 3], prob: r.prob, level: r.level, top: r.reasons[0] });
    }
    return out;
  }
  const FEAT = { rain_forecast_mm: "tomorrow's rain", rain_forecast_3d_mm: "the wet 3-day forecast", rain_3day_mm_lag1: "recent rain", achievement_pct_lag1: "yesterday's output", ach_mean7_lag1: "the past week's output", shortfalls_last7: "recent shortfalls", blast_delay_hours_lag1: "blast delays", hoist_uptime_pct_lag1: "hoist uptime" };
  const friendly = (f) => FEAT[f] || String(f).replace(/_/g, " ");

  async function select(lat, lon, name) {
    selected = { lat, lon };
    map.getSource("sel").setData({ type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Point", coordinates: [lon, lat] }, properties: {} }] });
    const R = $("#right"); R.style.display = "block";
    R.innerHTML = '<button class="btn" id="close">✕</button><h3>Selected location</h3><div class="big">…</div><div class="note">Loading forecast…</div>';
    $("#close").onclick = closePanel;
    try {
      const u = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
        "&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&past_days=2&forecast_days=8&timezone=auto";
      const [w, label] = await Promise.all([getJSON(u), name ? Promise.resolve(name) : reverse(lat, lon)]);
      if (!selected || selected.lat !== lat || selected.lon !== lon) return;
      render(w, label, lat, lon);
    } catch (e) {
      R.innerHTML = '<button class="btn" id="close">✕</button><h3>Selected location</h3><div class="note">Could not load the forecast (offline or API limit). Try again in a moment.</div>';
      $("#close").onclick = closePanel;
    }
  }
  async function reverse(lat, lon) {
    try {
      const j = await getJSON("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=" + lat + "&lon=" + lon);
      return (j.name || (j.address && (j.address.city || j.address.state || j.address.country))) || null;
    } catch (e) { return null; }
  }
  function closePanel() { selected = null; $("#right").style.display = "none"; map.getSource("sel").setData({ type: "FeatureCollection", features: [] }); }
  const dow = (s) => new Date(s + "T12:00:00").toLocaleDateString("en", { weekday: "short" });
  function render(w, label, lat, lon) {
    const d = w.daily, c = w.current, [ic, tx] = wx(c.weather_code);
    const days = [];
    for (let i = 2; i < 10 && i < d.time.length; i++) {
      const [e] = wx(d.weather_code[i]);
      days.push('<div class="day"><b>' + (i === 2 ? "Today" : dow(d.time[i])) + '</b><span class="ic">' + e + "</span><br>" + Math.round(d.temperature_2m_max[i]) + "° / " + Math.round(d.temperature_2m_min[i]) + "°<br>💧 " + Math.round(d.precipitation_sum[i] || 0) + " mm</div>");
    }
    let outl = [], html = "";
    try { outl = outlook(d); } catch (e) { outl = []; }
    const worst = outl.reduce((a, b) => (b.prob > a.prob ? b : a), outl[0] || { prob: 0, level: "Low" });
    let risk = "";
    if (outl.length) {
      risk = '<h3 style="margin-top:14px">Shortfall outlook · next 7 days</h3>' +
        '<div class="risk">' + outl.map((o) => '<div class="' + o.level + '" style="height:' + Math.max(4, Math.round(o.prob * 100)) + '%"><span>' + Math.round(o.prob * 100) + "</span></div>").join("") + "</div>" +
        '<div class="lab">' + outl.map((o) => "<div>" + dow(o.date) + "</div>").join("") + "</div>" +
        '<div style="margin-top:8px"><span class="pill ' + worst.level + '">' + worst.level.toUpperCase() + '</span> peak on <b>' + dow(worst.date) + "</b> — driven mainly by <b>" + esc(friendly(worst.top.f)) + "</b>.</div>" +
        '<div class="note">Indicative only: the GeoMine shortfall model (XGBoost, trained on <u>simulated</u> operations) is run for a healthy reference underground mine placed here, using this place\'s real forecast rain. It shows how weather alone would stress output — not a prediction for any real mine.</div>';
    }
    $("#right").innerHTML =
      '<button class="btn" id="close">✕</button><h3>Selected location</h3>' +
      '<div style="font-weight:700;font-size:16px">' + esc(label || "Unnamed place") + "</div>" +
      '<div class="note">' + lat.toFixed(3) + "°, " + lon.toFixed(3) + "°</div>" +
      '<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span class="big">' + ic + " " + Math.round(c.temperature_2m) + "°C</span><span class=\"note\">" + tx + "<br>💨 " + Math.round(c.wind_speed_10m) + " km/h · 💧 " + c.relative_humidity_2m + "% RH</span></div>" +
      '<a class="btn" style="display:block;text-align:center;text-decoration:none;margin:8px 0" href="index.html?lat=' + lat.toFixed(4) + '&lon=' + lon.toFixed(4) + '&name=' + encodeURIComponent(label || "Selected site") + '">Open in Control Room →</a>' +
      '<h3>Forecast</h3><div class="days">' + days.join("") + "</div>" + risk +
      '<div class="note" style="margin-top:10px">Weather: Open-Meteo (CC BY 4.0).</div>';
    $("#close").onclick = closePanel;
  }
})();
</script>
</body>
</html>
